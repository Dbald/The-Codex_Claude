<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Codex</title>
    <script>
      // Sign-up links (QR codes, homepage buttons) may point at the site root with
      // ?interest=... — send those straight to the early-access form, keeping the query.
      if (/[?&]interest=/.test(location.search)) location.replace('/early-access/' + location.search);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

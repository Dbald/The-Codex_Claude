<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're On The List · The Codex</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #FFFFFF; color: #121316; font-family: 'Archivo', system-ui, sans-serif; font-size: 18px; text-align: center; }
  .mark { display: grid; grid-template-columns: repeat(2, 22px); gap: 6px; justify-content: center; margin: 0 0 22px; }
  .mark i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .mark i:nth-child(1) { background: #00756B; }
  .mark i:nth-child(2) { background: #2F3BD8; }
  .mark i:nth-child(3) { background: #F26B1D; }
  .mark i:nth-child(4) { background: #121316; }
  h1 { font-family: 'Archivo', 'Arial Black', system-ui, sans-serif; font-stretch: 125%; font-weight: 900; text-transform: uppercase; font-size: 36px; line-height: 1; margin: 0 0 12px; }
  p { color: #3B4046; }
  a { display: inline-block; margin-top: 12px; color: #FFFFFF; background: #121316; font-weight: 700; text-decoration: none; padding: 14px 22px; border-radius: 999px; }
  a:hover { background: #2B2E33; }
  :focus-visible { outline: 3px solid #2F3BD8; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>You're on the list.</h1>
    <p>Thanks for signing up. We'll be in touch when the first course opens.</p>
    <a href="https://oceanexp.netlify.app/">Explore the reef while you wait →</a>
  </main>
</body>
</html>
